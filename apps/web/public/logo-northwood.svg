<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80" role="img" aria-label="Northwood Architects + Planners">
  <title>Northwood Architects + Planners</title>
  <!--
    Tenant logo: Northwood Architects + Planners (demo architecture firm).
    PLACEHOLDER for demo purposes only. In production, real tenants upload
    their own logo via the white-label theming UI.

    Mark: geometric monogram "N" combined with a stylized conifer silhouette.
    Architecture firms expect architectural marks; this gives one (clean
    geometry, no decoration) without resorting to the generic pyramid/triangle
    every firm uses.
    Color story: deep slate ink for the architectural restraint, single
    moss accent for the tree (Northwood = north + wood).
  -->

  <!-- N + tree monogram -->
  <g transform="translate(8, 18)">
    <!-- "N" form built from architectural lines -->
    <line x1="2" y1="44" x2="2" y2="4" stroke="#1A1815" stroke-width="3" stroke-linecap="square"/>
    <line x1="32" y1="44" x2="32" y2="4" stroke="#1A1815" stroke-width="3" stroke-linecap="square"/>
    <line x1="2" y1="4" x2="32" y2="44" stroke="#1A1815" stroke-width="3" stroke-linecap="square"/>

    <!-- Conifer/tree mark above the N — moss colored to suggest "wood" -->
    <path d="M 42 4 L 50 16 L 46 16 L 52 26 L 48 26 L 54 36 L 38 36 L 44 26 L 40 26 L 46 16 L 42 16 Z" fill="#3F5236"/>
    <line x1="46" y1="36" x2="46" y2="44" stroke="#3F5236" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark in two lines -->
  <text x="78" y="38" font-family="'Source Serif 4', 'Newsreader', Georgia, serif" font-size="22" font-weight="500" fill="#1A1815" letter-spacing="-0.4">Northwood</text>
  <text x="78" y="62" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#6B5D4F" letter-spacing="0.4">Architects + Planners</text>
</svg>
