<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-label="Sunrise Community Health">
  <title>Sunrise Community Health</title>
  <!--
    Tenant logo: Sunrise Community Health (demo non-profit).
    PLACEHOLDER for demo purposes only. In production, real tenants upload
    their own logo via the white-label theming UI.

    Mark: stylized sunrise — a half-disc with three rays above a horizon line.
    Color story: warm sunrise tones (rust → ochre) for the disc and rays,
    suggesting both the org name and the warmth of community health work.
    Sits in the same editorial register as the Forager mark — clean lines,
    no gradients, restrained.
  -->

  <!-- Sunrise mark -->
  <g transform="translate(8, 18)">
    <!-- Horizon line -->
    <line x1="0" y1="44" x2="56" y2="44" stroke="#1A1815" stroke-width="2" stroke-linecap="round"/>

    <!-- Sun disc (half) -->
    <path d="M 14 44 A 14 14 0 0 1 42 44 Z" fill="#C66B3D"/>

    <!-- Sun rays -->
    <line x1="28" y1="12" x2="28" y2="6" stroke="#A87A3D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="20" x2="7" y2="16" stroke="#A87A3D" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="20" x2="49" y2="16" stroke="#A87A3D" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark in two lines -->
  <text x="76" y="38" font-family="'Source Serif 4', 'Newsreader', Georgia, serif" font-size="22" font-weight="500" fill="#1A1815" letter-spacing="-0.4">Sunrise</text>
  <text x="76" y="62" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#6B5D4F" letter-spacing="0.4">Community Health</text>
</svg>
