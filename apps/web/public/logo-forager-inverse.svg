<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" role="img" aria-label="Forager">
  <title>Forager</title>
  <!--
    Inverse Forager wordmark for dark backgrounds.
    Same structure as logo-forager.svg but with cream text + lighter moss + brighter ochre
    for sufficient contrast on dark canvas (#1A1815 or similar).
    Used in: marketing dark-mode surfaces, social share cards, partner themes that opt for dark UI.
  -->
  <!-- Sprig glyph in lighter moss -->
  <g transform="translate(8, 22)" fill="none" stroke="#A8B79C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 36 Q 3 18, 9 0"/>
    <path d="M 6.6 15 Q -3 12, -4.8 4.8 Q 3 7.2, 6.6 15 Z" fill="#A8B79C" stroke="none"/>
    <path d="M 7.8 7.2 Q 16.8 4.8, 19.2 -2.4 Q 10.8 -1.2, 7.8 7.2 Z" fill="#A8B79C" stroke="none"/>
  </g>
  <circle cx="17" cy="20.8" r="2.4" fill="#D4A574"/>

  <!-- Wordmark in cream -->
  <text x="56" y="56" font-family="'Source Serif 4', 'Newsreader', Georgia, serif" font-size="44" font-weight="500" fill="#FAF7F2" letter-spacing="-1.2">Forager</text>
</svg>
